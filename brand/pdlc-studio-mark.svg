<?xml version="1.0" encoding="UTF-8"?>
<!--
  PDLC Studio app mark — display size.

  Canonical source: brand/pdlc-studio-mark.svg. Edit it there, then run
  `make sync-brand`; copies of this file live in frontend/public/, and
  frontend/src/components/AppIcon.tsx inlines the same geometry for React.
  AppIcon.test.tsx fails if the three drift apart.

  ── What it is ────────────────────────────────────────────────────────────────
  A shell prompt (`>_`) at the centre of a ring of graduated dots. The prompt is
  the command line this app drives; the ring is the development life cycle its
  name refers to, and the colour sweeps blue-to-green around it to give the
  cycle a direction.

  ── Construction ──────────────────────────────────────────────────────────────
  512 × 512 grid, everything centred on (256, 256).

    Tile        rounded square, r=112, filled #0B1A23 (ink). The dark ground is
                not decorative: the blue-to-green sweep has almost no contrast
                against a light tile.
    Main ring   14 dots on a circle of radius 150, starting at 12 o'clock and
                stepping 360/14 ≈ 25.714°. Dot radii cycle 25, 15, 21, 26, 14,
                22, 18 — a 7-step cycle against 14 positions, so opposite sides
                of the ring mirror each other.
    Satellites  8 smaller dots between radius 191 and 199, at irregular angles.
                They are the texture, and the first thing lost below ~32px.
    Prompt      stroked, 39 wide, round caps and joins, in near-white so it
                reads as the subject rather than as more ring.

  ── The gradient ──────────────────────────────────────────────────────────────
  gradientUnits="userSpaceOnUse" is load-bearing. Under the default
  objectBoundingBox, every dot would get the entire blue-to-green ramp across
  its own few pixels and the ring would come out uniformly muddy. Anchoring the
  ramp to the canvas (x from 88 to 424) is what makes each dot pick up the one
  colour that belongs at its position.

  ── Small sizes ───────────────────────────────────────────────────────────────
  Dots are a texture and need room. Below roughly 32px they merge and this mark
  turns to mush — use pdlc-studio-mark-small.svg there instead. That file is a
  second optical size of one identity, not a second mark.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="PDLC Studio"
>
  <defs>
    <linearGradient
      id="pdlc-sweep"
      gradientUnits="userSpaceOnUse"
      x1="88"
      y1="256"
      x2="424"
      y2="256"
    >
      <stop offset="0" stop-color="#3992F9" />
      <stop offset="0.35" stop-color="#26B6D0" />
      <stop offset="0.7" stop-color="#13D2A6" />
      <stop offset="1" stop-color="#06F28C" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0B1A23" />

  <g fill="url(#pdlc-sweep)">
    <!-- main ring: 14 dots, radius 150, from 12 o'clock clockwise -->
    <circle cx="256.0" cy="106.0" r="25" />
    <circle cx="321.1" cy="120.9" r="15" />
    <circle cx="373.3" cy="162.5" r="21" />
    <circle cx="402.2" cy="222.6" r="26" />
    <circle cx="402.2" cy="289.4" r="14" />
    <circle cx="373.3" cy="349.5" r="22" />
    <circle cx="321.1" cy="391.1" r="18" />
    <circle cx="256.0" cy="406.0" r="25" />
    <circle cx="190.9" cy="391.1" r="15" />
    <circle cx="138.7" cy="349.5" r="21" />
    <circle cx="109.8" cy="289.4" r="26" />
    <circle cx="109.8" cy="222.6" r="14" />
    <circle cx="138.7" cy="162.5" r="22" />
    <circle cx="190.9" cy="120.9" r="18" />

    <!-- satellites: outside the ring, irregular on purpose -->
    <circle cx="329.4" cy="74.3" r="9" />
    <circle cx="432.3" cy="177.5" r="7" />
    <circle cx="449.1" cy="304.1" r="10" />
    <circle cx="357.2" cy="418.0" r="7" />
    <circle cx="208.3" cy="447.1" r="9" />
    <circle cx="93.2" cy="357.7" r="6" />
    <circle cx="65.7" cy="201.4" r="8" />
    <circle cx="153.2" cy="91.5" r="7" />
  </g>

  <g
    fill="none"
    stroke="#F2F7F9"
    stroke-width="39"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M193 205 L241 254 L193 302" />
    <path d="M280 302 H319" />
  </g>
</svg>
