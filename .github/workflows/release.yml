name: Release

# Two ways in:
#
# 1. workflow_dispatch with a version — the normal path. `prepare` bumps
#    backend/package.json, commits, and creates the tag, then this same run
#    builds and publishes. Doing it in one run is what lets the built-in
#    GITHUB_TOKEN suffice: a tag pushed with GITHUB_TOKEN does not trigger
#    other workflows, so a separate tag-triggered run would never fire.
#    Replaces tagpr, which needed a PAT for exactly that reason.
#
# 2. Pushing a tag by hand — still supported. `prepare` is skipped and the
#    pushed tag is used as-is.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.0 (no "v" prefix)'
        required: true
        type: string

jobs:
  prepare:
    # Only the manual path needs a tag created; a tag push already has one.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history and tags so the duplicate-tag check is meaningful.
          fetch-depth: 0
          fetch-tags: true

      - name: Bump version, commit and tag
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=Invalid version::'$VERSION' is not semver. Use 0.3.0, not v0.3.0 (.tagpr used vPrefix=false and the existing 0.2.0 tag has no prefix)."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error title=Tag exists::$VERSION is already tagged. Releases are immutable — pick a new version."
            exit 1
          fi

          # Regex rather than JSON.parse/stringify so the file's existing
          # formatting survives untouched.
          node -e '
            const fs = require("fs");
            const path = "backend/package.json";
            const before = fs.readFileSync(path, "utf8");
            const after = before.replace(
              /^(\s*"version":\s*)"[^"]+"/m,
              `$1"${process.env.VERSION}"`,
            );
            fs.writeFileSync(path, after);
          '

          ACTUAL="$(node -p 'require("./backend/package.json").version')"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error title=Bump failed::backend/package.json reports '$ACTUAL' after the edit, expected '$VERSION'."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # generate-version.js reads this file, so the binary's --version
          # follows from it. cli/version.ts is gitignored and rebuilt below.
          if git diff --quiet -- backend/package.json; then
            echo "backend/package.json is already at $VERSION; tagging the current commit."
          else
            git add backend/package.json
            git commit -m "Release $VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    # `prepare` is skipped on the tag-push path, and a skipped dependency would
    # otherwise skip this job too.
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pdlc-studio-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: pdlc-studio-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: pdlc-studio-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: pdlc-studio-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: pdlc-studio-windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # On the manual path github.ref is a branch, so build the tag that
          # `prepare` just created rather than whatever main has moved to.
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Copy frontend assets
        run: node scripts/copy-frontend.js
        working-directory: backend

      - name: Generate version.ts
        run: node scripts/generate-version.js
        working-directory: backend

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Install and cache Deno dependencies
        run: deno install && deno cache cli/deno.ts
        working-directory: backend

      - name: Build backend binary
        run: deno compile --allow-net --allow-run --allow-read --allow-write --allow-env --allow-sys --include ./dist/static --target ${{ matrix.target }} --output ../dist/${{ matrix.artifact_name }} cli/deno.ts
        working-directory: backend

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: frontend

      - name: Start development server
        run: |
          cd frontend
          npm run dev &
          # Wait for server to be ready
          timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
        continue-on-error: false

      - name: Record demo videos
        run: |
          cd frontend
          npm run record-demo codeGeneration -- --theme=both
        continue-on-error: true

      - name: Stop development server
        run: |
          # Kill any remaining dev server processes
          pkill -f "vite" || true
        continue-on-error: true

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ./artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          # Required on the manual path: github.ref is a branch there, so the
          # tag cannot be inferred.
          tag_name: ${{ needs.prepare.outputs.tag || github.ref_name }}
          files: |
            artifacts/*/*
            frontend/demo-recordings/*.webm
          draft: true
          prerelease: false

      - name: Publish release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  npm-publish:
    needs: [prepare, build]
    # Opt-in. Publishing to npm is effectively irreversible: unpublish is
    # limited to a 72-hour window and a version number can never be reused.
    # `pdlc-studio` has never been published, so the first run would also claim
    # the name on the public registry. Set the repository variable
    # ENABLE_NPM_PUBLISH to "true" when you actually intend to publish; until
    # then a tag push builds binaries and publishes the GitHub Release only.
    #
    # Note the first publish likely needs a NODE_AUTH_TOKEN regardless: OIDC
    # trusted publishing has to be configured against an existing npm package.
    if: ${{ !cancelled() && needs.build.result == 'success' && vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # Required for repository access
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Update npm to latest version
        run: npm install -g npm@latest

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build npm package
        run: npm run build
        working-directory: backend

      - name: Test npm package
        run: |
          npm run test
          # Test global installation
          npm pack
          PACKAGE_FILE=$(ls *.tgz)
          npm install -g "./$PACKAGE_FILE"
          # Test CLI functionality
          pdlc-studio --version
        working-directory: backend

      - name: Publish to npm (dry-run)
        run: npm publish --dry-run
        working-directory: backend

      - name: Publish to npm
        run: npm publish
        working-directory: backend
