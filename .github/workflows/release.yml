name: Release

# Two ways in:
#
# 1. workflow_dispatch with a version — the normal path. `prepare` bumps
#    backend/package.json, commits, and creates the tag, then this same run
#    builds and publishes. Doing it in one run is what lets the built-in
#    GITHUB_TOKEN suffice: a tag pushed with GITHUB_TOKEN does not trigger
#    other workflows, so a separate tag-triggered run would never fire.
#    Replaces tagpr, which needed a PAT for exactly that reason.
#
# 2. Pushing a tag by hand — still supported. `prepare` is skipped and the
#    pushed tag is used as-is.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.0 (no "v" prefix)'
        required: true
        type: string

jobs:
  prepare:
    # Only the manual path needs a tag created; a tag push already has one.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags so the duplicate-tag check is meaningful.
          fetch-depth: 0
          fetch-tags: true

      - name: Bump version, commit and tag
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=Invalid version::'$VERSION' is not semver. Use 0.3.0, not v0.3.0 (.tagpr used vPrefix=false and the existing 0.2.0 tag has no prefix)."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error title=Tag exists::$VERSION is already tagged. Releases are immutable — pick a new version."
            exit 1
          fi

          # Regex rather than JSON.parse/stringify so the file's existing
          # formatting survives untouched.
          node -e '
            const fs = require("fs");
            const path = "backend/package.json";
            const before = fs.readFileSync(path, "utf8");
            const after = before.replace(
              /^(\s*"version":\s*)"[^"]+"/m,
              `$1"${process.env.VERSION}"`,
            );
            fs.writeFileSync(path, after);
          '

          ACTUAL="$(node -p 'require("./backend/package.json").version')"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error title=Bump failed::backend/package.json reports '$ACTUAL' after the edit, expected '$VERSION'."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # generate-version.js reads this file, so the binary's --version
          # follows from it. cli/version.ts is gitignored and rebuilt below.
          if git diff --quiet -- backend/package.json; then
            echo "backend/package.json is already at $VERSION; tagging the current commit."
          else
            git add backend/package.json
            git commit -m "Release $VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    # `prepare` is skipped on the tag-push path, and a skipped dependency would
    # otherwise skip this job too.
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pdlc-studio-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: pdlc-studio-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: pdlc-studio-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: pdlc-studio-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On the manual path github.ref is a branch, so build the tag that
          # `prepare` just created rather than whatever main has moved to.
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Copy frontend assets
        run: node scripts/copy-frontend.js
        working-directory: backend

      - name: Generate version.ts
        run: node scripts/generate-version.js
        working-directory: backend

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      # `deno install` was previously used here, which resolves the full
      # package.json — devDependencies and every platform-specific optional
      # dependency included. `deno compile` then embedded that whole
      # node_modules tree, which is why the binaries were 428 MB (macOS) and
      # 741 MB (Linux).
      #
      # The two big wins:
      #   --omit=dev       drops typescript, eslint, prettier, esbuild (~46 MB)
      #   --omit=optional  drops @anthropic-ai/claude-agent-sdk-<platform>,
      #                    a full Claude Code native binary at ~245 MB. This app
      #                    never runs it: chat.ts passes an explicit
      #                    pathToClaudeCodeExecutable pointing at the user's own
      #                    installed CLI, so the bundled copy is dead weight.
      #
      # Measured on macOS arm64: 428 MB -> 94 MB.
      - name: Install production dependencies
        run: npm ci --omit=dev --omit=optional
        working-directory: backend

      # --node-modules-dir=manual uses the pruned tree above verbatim instead of
      # re-resolving it. --no-check is required because dropping devDependencies
      # removes @types/node, which a JSR dependency needs for type resolution;
      # types are already checked by `make check` on every PR, and this step only
      # packages an already-reviewed commit.
      - name: Build backend binary
        run: deno compile --allow-net --allow-run --allow-read --allow-write --allow-env --allow-sys --node-modules-dir=manual --no-check --include ./dist/static --target ${{ matrix.target }} --output ../dist/${{ matrix.artifact_name }} cli/deno.ts
        working-directory: backend

      # macOS ships as a mountable disk image. Renaming the executable to .dmg
      # would produce a file macOS cannot mount, so build a real UDZO image with
      # the binary inside. UDZO is compressed, which shrinks the download again.
      # "No space left on device" here is about the *image*, not the runner:
      # df reports ~96 GiB free, and the error names the mounted volume
      # ("could not access /Volumes/PDLC Studio/..."). Left to size the image
      # itself from -srcfolder, hdiutil allows too little slack for filesystem
      # overhead, which is why only the larger x86_64 binary failed while arm64
      # passed. Sizing it explicitly with headroom removes the guesswork.
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          df -h / | tail -1

          STAGING="$RUNNER_TEMP/dmg"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          # Moved, not copied: the raw binary is deleted after packaging
          # anyway, so a second copy would only ever be thrown away.
          mv "dist/${{ matrix.artifact_name }}" "$STAGING/pdlc-studio"
          chmod +x "$STAGING/pdlc-studio"

          BYTES=$(stat -f%z "$STAGING/pdlc-studio")
          SIZE_MB=$(( BYTES / 1024 / 1024 + 200 ))
          echo "binary $(( BYTES / 1024 / 1024 ))MB -> image ${SIZE_MB}MB"

          # UDZO still compresses the result; -size only bounds the volume the
          # files are written into before compression.
          hdiutil create -volname "PDLC Studio" -srcfolder "$STAGING" \
            -size "${SIZE_MB}m" -ov -format UDZO \
            "dist/${{ matrix.artifact_name }}.dmg"

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/tar"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp "dist/${{ matrix.artifact_name }}" "$STAGING/pdlc-studio"
          chmod +x "$STAGING/pdlc-studio"
          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C "$STAGING" pdlc-studio
          # Ship the archive only, so there is one obvious download per platform.
          rm "dist/${{ matrix.artifact_name }}"

      - name: Report artifact size
        run: ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: frontend

      - name: Start development server
        run: |
          cd frontend
          npm run dev &
          # Wait for server to be ready
          timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
        continue-on-error: false

      - name: Record demo videos
        run: |
          cd frontend
          npm run record-demo codeGeneration -- --theme=both
        continue-on-error: true

      - name: Stop development server
        run: |
          # Kill any remaining dev server processes
          pkill -f "vite" || true
        continue-on-error: true

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ./artifacts

      - name: Upload release assets
        id: draft
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          # Required on the manual path: github.ref is a branch there, so the
          # tag cannot be inferred.
          tag_name: ${{ needs.prepare.outputs.tag || github.ref_name }}
          files: |
            artifacts/*/*
            frontend/demo-recordings/*.webm
          draft: true
          prerelease: false

      # Publishes by release *id*, not by tag.
      #
      # The previous step deliberately creates a draft so a half-uploaded
      # release is never visible. But a draft has no tag ref — GitHub files it
      # under `untagged-<hash>` until it is published — so a second
      # action-gh-release keyed on `tag_name` may not find it and creates a
      # *second* release instead. That is exactly what happened on 1.1.0: the
      # assets stayed in the invisible draft while users saw a published
      # release with nothing to download. It worked on 1.0.0, so the lookup is
      # racy rather than reliably wrong.
      #
      # The id from the upload step is unambiguous, so this cannot happen.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_ID}" ]; then
            echo "::error::upload step reported no release id; refusing to guess"
            exit 1
          fi

          # PATCH does not generate notes, so ask for them explicitly.
          notes=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" --jq .body)

          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f tag_name="${TAG}" \
            -f name="${TAG}" \
            -f body="${notes}" \
            --jq '"published \(.tag_name) with \(.assets | length) assets"'

          # A release with no binaries is the failure this step exists to
          # prevent, so fail loudly rather than leaving one published.
          count=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets | length')
          if [ "${count}" -lt 4 ]; then
            echo "::error::published release has ${count} assets, expected at least 4"
            exit 1
          fi

  npm-publish:
    needs: [prepare, build]
    # Opt-in. Publishing to npm is effectively irreversible: unpublish is
    # limited to a 72-hour window and a version number can never be reused.
    # `pdlc-studio` has never been published, so the first run would also claim
    # the name on the public registry. Set the repository variable
    # ENABLE_NPM_PUBLISH to "true" when you actually intend to publish; until
    # then a tag push builds binaries and publishes the GitHub Release only.
    #
    # Note the first publish likely needs a NODE_AUTH_TOKEN regardless: OIDC
    # trusted publishing has to be configured against an existing npm package.
    if: ${{ !cancelled() && needs.build.result == 'success' && vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # Required for repository access
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Update npm to latest version
        run: npm install -g npm@latest

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build npm package
        run: npm run build
        working-directory: backend

      - name: Test npm package
        run: |
          npm run test
          # Test global installation
          npm pack
          PACKAGE_FILE=$(ls *.tgz)
          npm install -g "./$PACKAGE_FILE"
          # Test CLI functionality
          pdlc-studio --version
        working-directory: backend

      - name: Publish to npm (dry-run)
        run: npm publish --dry-run
        working-directory: backend

      - name: Publish to npm
        run: npm publish
        working-directory: backend
