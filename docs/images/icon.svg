<?xml version="1.0" encoding="UTF-8"?>
<!--
  PDLC Studio app mark.

  Self-contained on purpose: the tile carries its own background, so the mark
  renders identically in light and dark mode, the way an OS app icon does.

  Both fills are explicit. The glyph originally had no `fill` attribute and so
  fell back to black, which meant any ancestor setting `fill: currentColor`
  would repaint it — in dark mode that is near-white on a light blue tile, which
  is close to invisible.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="PDLC Studio"
>
  <path
    fill="#60b8e3"
    fill-rule="evenodd"
    d="M512 64c0-35.3-28.7-64-64-64H64C28.7 0 0 28.7 0 64v384c0 35.3 28.7 64 64 64h384c35.3 0 64-28.7 64-64z"
  />
  <path
    fill="#000000"
    d="M416 416H96v-94.4h108.2v32H128V384h256v-30.4h-85L195.4 190.4H96V96h320v94.4H307.8v-32H384V128H128v30.4h85l103.6 163.2H416z"
  />
</svg>
